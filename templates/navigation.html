<button type="button" class="navigation-toggle" id="navigation-toggle" aria-label="Toggle navigation" aria-controls="main-navigation" aria-expanded="false" hidden>
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
</button>
<nav id="main-navigation" class="main-navigation" aria-label="Main navigation">
    <a href="{{ url_for('dashboard.transactions_page') }}"{% if navigation_page == 'transactions' %} aria-current="page"{% endif %}>Transactions</a>
    <a href="{{ url_for('dashboard.income_streams') }}"{% if navigation_page == 'income-streams' %} aria-current="page"{% endif %}>Income streams</a>
    <a href="{{ url_for('deductions.page') }}"{% if navigation_page == 'deductions' %} aria-current="page"{% endif %}>Deductions</a>
    <a href="{{ url_for('dashboard.tax_estimate') }}"{% if navigation_page == 'tax-estimate' %} aria-current="page"{% endif %}>Tax estimate</a>
    <a href="{{ url_for('dashboard.tax_rules') }}"{% if navigation_page == 'tax-rules' %} aria-current="page"{% endif %}>Tax rules</a>
    {% if navigation_owner %}
    <a href="{{ url_for('system.page') }}"{% if navigation_page == 'system' %} aria-current="page"{% endif %}>System</a>
    <form class="test-data-form" method="post" action="{{ url_for('dashboard.switch_test_data') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" role="switch" aria-checked="{{ 'true' if using_test_data else 'false' }}" name="enabled" value="{{ '0' if using_test_data else '1' }}" title="Switch between real records and isolated sample data.">
            <span class="test-data-track" aria-hidden="true"><span></span></span><span>Test data</span>
        </button>
    </form>
    <a href="{{ url_for('login.change_password') }}"{% if navigation_page == 'settings' %} aria-current="page"{% endif %}>Password settings</a>
    <form class="logout-form" method="post" action="{{ url_for('login.sign_out') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Sign out</button>
    </form>
    {% endif %}
</nav>

<script src="{{ url_for('static', filename='js/navigation.js') }}" defer></script>
